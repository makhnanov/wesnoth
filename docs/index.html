<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Hex Map with Menu</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #mainCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: black;
            cursor: grab;
        }

        #mainCanvas.dragging {
            cursor: grabbing;
        }

        #menuButton {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 1000;
        }

        #sideMenu {
            position: absolute;
            top: 60px;
            left: -250px;
            width: 290px;
            background: #111;
            color: white;
            transition: all 0.6s ease;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1001;
            border: 2px solid rgba(245, 222, 179, 0);
            opacity: 0;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        #sideMenu.open {
            left: 20px;
            border: 2px solid wheat;
            opacity: 1;
        }

        #menuCanvas {
            position: absolute;
            top: -2px;
            left: -2px;
            z-index: -1;
            pointer-events: none;
        }

        .tile-header {
            margin-top: 0;
        }

        .tile-option {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0;
            clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
            object-fit: cover;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .tile-option.selected {
            box-shadow: 0 0 0 4px lime;
            opacity: 1;
        }

        #zoomIndicator {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            font-size: 20px;
            font-family: sans-serif;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 2000;
        }
    </style>
</head>
<body>
<button id="menuButton">☰</button>
<div id="sideMenu">
    <canvas id="menuCanvas"></canvas>
    <h3 class="tile-header">Tiles:</h3>
    <img src="https://raw.githubusercontent.com/wesnoth/wesnoth/refs/heads/master/data/core/images/terrain/flat/road.png" alt="road"
         id="tile1" class="tile-option">
    <img src="https://raw.githubusercontent.com/wesnoth/wesnoth/refs/heads/master/data/core/images/terrain/swamp/water-tile.png" alt="water"
         id="tile2" class="tile-option">
    <img src="https://raw.githubusercontent.com/wesnoth/wesnoth/refs/heads/master/data/core/images/terrain/interior/stone-regular.png" alt="stone"
         id="tile3" class="tile-option">
</div>
<canvas id="mainCanvas"></canvas>
<div id="zoomIndicator"></div>

<script>
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');

    const menuCanvas = document.getElementById('menuCanvas');
    const menuCtx = menuCanvas.getContext('2d');

    const menuButton = document.getElementById('menuButton');
    const sideMenu = document.getElementById('sideMenu');

    let scale = 1.0;
    let offsetX = 0;
    let offsetY = 0;

    let dragging = false;
    let painting = false;
    let lastMouse = {x: 0, y: 0};
    let selectedTile = null;
    let placedTiles = {};

    let spacePressed = false;

    // History system for undo functionality
    let history = [];
    const MAX_HISTORY = 100;

    function saveState() {
        // Create a serializable copy by storing tile IDs
        const stateCopy = {};
        for (let key in placedTiles) {
            if (placedTiles[key] && placedTiles[key].id) {
                stateCopy[key] = placedTiles[key].id;
            }
        }
        
        const state = JSON.stringify(stateCopy);
        history.push(state);
        
        // Limit history to MAX_HISTORY entries
        if (history.length > MAX_HISTORY) {
            history.shift();
        }
    }

    function undo() {
        if (history.length > 0) {
            const lastState = history.pop();
            const stateData = JSON.parse(lastState);
            
            // Clear current tiles and restore from state
            placedTiles = {};
            for (let key in stateData) {
                const tileElement = document.getElementById(stateData[key]);
                if (tileElement) {
                    placedTiles[key] = tileElement;
                }
            }
            
            draw();
        }
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        mainCanvas.width = window.innerWidth * dpr;
        mainCanvas.height = window.innerHeight * dpr;
        mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const rect = sideMenu.getBoundingClientRect();
        menuCanvas.width = rect.width * dpr;
        menuCanvas.height = rect.height * dpr;
        menuCanvas.style.width = rect.width + 'px';
        menuCanvas.style.height = rect.height + 'px';
        menuCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        draw();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    menuButton.addEventListener('click', () => {
        sideMenu.classList.toggle('open');
        resizeCanvas();
    });

    const tiles = document.querySelectorAll('.tile-option');
    tiles.forEach(tile => {
        tile.addEventListener('click', () => {
            if (selectedTile === tile) {
                // Deselect if clicking the already selected tile
                tiles.forEach(t => t.classList.remove('selected'));
                selectedTile = null;
            } else {
                // Select the new tile
                tiles.forEach(t => t.classList.remove('selected'));
                tile.classList.add('selected');
                selectedTile = tile;
            }
            draw();
        });
    });

    function drawHexAt(ctx, cx, cy, size) {
        const pts = [
            [0.25, 0.067],
            [0.75, 0.067],
            [1, 0.5],
            [0.75, 0.933],
            [0.25, 0.933],
            [0, 0.5]
        ];
        const half = size / 2;
        const left = cx - half;
        const top = cy - half;
        ctx.beginPath();
        pts.forEach((p, i) => {
            const x = left + p[0] * size;
            const y = top + p[1] * size;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath();
    }

    function draw() {
        mainCtx.fillStyle = 'black';
        mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

        const baseSize = 72;
        const size = baseSize * scale;
        const dx = size * 0.75;
        const dy = size * 0.866;

        const cols = Math.ceil(mainCanvas.width / dx) + 4;
        const rows = Math.ceil(mainCanvas.height / dy) + 4;

        const startCol = Math.floor(-offsetX / dx) - 2;
        const startRow = Math.floor(-offsetY / dy) - 2;

        for (let row = startRow; row < startRow + rows; row++) {
            for (let col = startCol; col < startCol + cols; col++) {
                const cx = offsetX + col * dx + size / 2;
                const cy = offsetY + row * dy + size / 2 + (col % 2 ? dy / 2 : 0);

                drawHexAt(mainCtx, cx, cy, size);

                const key = row + ',' + col;
                if (placedTiles[key]) {
                    mainCtx.save();
                    mainCtx.clip();
                    mainCtx.drawImage(placedTiles[key], cx - size / 2, cy - size / 2, size, size);
                    mainCtx.restore();
                }

                mainCtx.lineWidth = 0.15;
                mainCtx.strokeStyle = 'gray';
                mainCtx.stroke();
            }
        }

        menuCtx.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
        if (selectedTile) {
            const rect = selectedTile.getBoundingClientRect();
            const menuRect = sideMenu.getBoundingClientRect();
            const tileCx = rect.left - menuRect.left + rect.width / 2;
            const tileCy = rect.top - menuRect.top + rect.height / 2;
            drawHexAt(menuCtx, tileCx, tileCy, baseSize);
            menuCtx.lineWidth = 4;
            menuCtx.strokeStyle = 'lime';
            menuCtx.stroke();
        }
    }

    function paintTileAt(clientX, clientY) {
        if (!selectedTile) return;

        const rect = mainCanvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const baseSize = 72;
        const size = baseSize * scale;
        const dx = size * 0.75;
        const dy = size * 0.866;

        const cols = Math.ceil(mainCanvas.width / dx) + 4;
        const rows = Math.ceil(mainCanvas.height / dy) + 4;
        const startCol = Math.floor(-offsetX / dx) - 2;
        const startRow = Math.floor(-offsetY / dy) - 2;

        for (let row = startRow; row < startRow + rows; row++) {
            for (let col = startCol; col < startCol + cols; col++) {
                const cx = offsetX + col * dx + size / 2;
                const cy = offsetY + row * dy + size / 2 + (col % 2 ? dy / 2 : 0);

                drawHexAt(mainCtx, cx, cy, size);
                if (mainCtx.isPointInPath(x, y)) {
                    const key = row + ',' + col;
                    
                    // Only save state and update if the tile is actually changing
                    if (placedTiles[key] !== selectedTile) {
                        saveState();
                        placedTiles[key] = selectedTile;
                        draw();
                    }
                    return;
                }
            }
        }
    }

    // обработка клавиш
    window.addEventListener('keydown', (e) => {
        // Undo with Ctrl+Z
        if (e.ctrlKey && e.code === 'KeyZ') {
            e.preventDefault();
            undo();
            return;
        }
        
        // Space for dragging
        if (e.code === 'Space' && !spacePressed) {
            spacePressed = true;
            mainCanvas.classList.add('dragging');
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space') {
            spacePressed = false;
            dragging = false;
            mainCanvas.classList.remove('dragging');
        }
    });

    // события мыши
    mainCanvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
            if (spacePressed) {
                dragging = true;
                lastMouse.x = e.clientX;
                lastMouse.y = e.clientY;
                mainCanvas.classList.add('dragging');
            } else {
                painting = true;
                paintTileAt(e.clientX, e.clientY);
            }
        } else if (e.button === 1) {
            e.preventDefault();
            dragging = true;
            lastMouse.x = e.clientX;
            lastMouse.y = e.clientY;
            mainCanvas.classList.add('dragging');
        }
    });

    mainCanvas.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
            if (spacePressed) {
                // прекращаем перемещение при отпускании ЛКМ с пробелом
                dragging = false;
                mainCanvas.classList.remove('dragging');
            } else {
                painting = false;
            }
        }
        if (e.button === 1) {
            dragging = false;
            mainCanvas.classList.remove('dragging');
        }
    });

    mainCanvas.addEventListener('mouseleave', () => {
        if (!spacePressed) painting = false;
        dragging = false;
        mainCanvas.classList.remove('dragging');
    });

    mainCanvas.addEventListener('mousemove', (e) => {
        if (painting) paintTileAt(e.clientX, e.clientY);
        if (dragging) {
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            offsetX += dx;
            offsetY += dy;
            lastMouse.x = e.clientX;
            lastMouse.y = e.clientY;
            draw();
        }
    });

    // масштабирование колесиком
    let zoomTimeout = null;
    const zoomIndicator = document.getElementById('zoomIndicator');

    function showZoomIndicator() {
        const percent = Math.round(scale * 100);
        zoomIndicator.textContent = percent + '%';
        zoomIndicator.style.opacity = "1";
        if (zoomTimeout) clearTimeout(zoomTimeout);
        zoomTimeout = setTimeout(() => {
            zoomIndicator.style.opacity = "0";
        }, 2000);
    }

    mainCanvas.addEventListener('wheel', (e) => {
        e.preventDefault();

        const rect = mainCanvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const worldXBefore = (mouseX - offsetX) / scale;
        const worldYBefore = (mouseY - offsetY) / scale;

        const zoomFactor = e.deltaY < 0 ? 1.01 : 0.99;
        scale *= zoomFactor;
        scale = Math.min(Math.max(scale, 0.3), 3.0);

        const worldXAfter = (mouseX - offsetX) / scale;
        const worldYAfter = (mouseY - offsetY) / scale;

        offsetX += (worldXAfter - worldXBefore) * scale;
        offsetY += (worldYAfter - worldYBefore) * scale;

        draw();
        showZoomIndicator();
    }, {passive: false});

    draw();
</script>
</body>
</html>
